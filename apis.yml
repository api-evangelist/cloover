aid: cloover
name: Cloover
description: >-
  Cloover is a climate-fintech company building an all-in-one, "Shopify of
  energy" platform for the residential renewable-energy transition. It connects
  the stakeholders of home energy - installers, homeowners (prosumers),
  manufacturers, energy providers and investors - so small and mid-sized
  installation firms can sell, quote, finance and manage solar panels, home
  batteries, heat pumps and EV charging in a single package. The platform pairs
  installer sales and operations software with embedded financing and energy
  management, and offers homeowners flexible subscription and financing options.
  Founded in 2023 and operating primarily in Germany, Austria and wider Europe,
  Cloover has raised sizeable seed and Series A equity plus a large debt facility
  and is backed by QED Investors, MMC Ventures, Lowercarbon Capital and others.
